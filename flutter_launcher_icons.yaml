# Icono oficial de KUS. Fuente: assets/branding/ (generado a partir de
# assets/images/app_movil_only_xl.png). Regenerar con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
